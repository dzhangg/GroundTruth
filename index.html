<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GroundTruth — Earthquake Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #map { height: 100vh; width: 100vw; }

    /* ── Control panel ────────────────────────────────────────────────────── */
    #controls {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 12px;
      min-width: 230px;
    }
    #controls h3 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #222;
    }
    .ctrl-row { margin-bottom: 10px; }
    .ctrl-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: #555;
      font-size: 11px;
    }
    .ctrl-label strong { color: #111; }
    #mag-slider { width: 100%; cursor: pointer; }

    /* Feature 2 — color toggle button */
    #color-toggle {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #333;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }
    #color-toggle:hover { background: #e8e8e8; }
    #color-toggle.active-depth {
      background: #e3f2fd;
      border-color: #90caf9;
      color: #1565c0;
    }

    /* Feature 3 — stats panel */
    .stats-divider { border-top: 1px solid #ddd; margin: 10px 0 8px; }
    #stats { font-size: 11px; color: #555; line-height: 1.75; }
    #stat-count { font-weight: 700; color: #111; }

    /* ── Legend ───────────────────────────────────────────────────────────── */
    .legend {
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 12px;
      line-height: 1.9;
    }
    .legend-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
    .dot {
      display: inline-block;
      width: 11px; height: 11px;
      border-radius: 50%;
      margin-right: 5px;
      border: 1px solid rgba(0,0,0,0.25);
      vertical-align: middle;
    }
    .legend-note { font-size: 10px; color: #777; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!--
    ── IMPLEMENTED ─────────────────────────────────────────────────────────────
    Feature 1 — Magnitude range slider  (see #mag-slider + applyFilters)
    Feature 2 — Depth color mode toggle (see #color-toggle + depthColor)
    Feature 3 — Stats panel             (see #stats + applyFilters stat update)

    ── TODO 4 — Timeline playback ──────────────────────────────────────────────
    Add a Play button that animates earthquakes appearing in chronological order.
    Approach: sort allMarkers by props.date, hide all on load, then use
    setInterval to reveal the next batch each tick and advance a time cursor
    displayed above the slider.

    ── TODO 5 — Heatmap layer toggle ───────────────────────────────────────────
    Add the Leaflet.heat plugin (leaflet-heat.js) and a second toggle button.
    When active, hide all circleMarkers and feed [lat, lng, intensity] rows
    to L.heatLayer() — intensity can be mag or 1/depth. Useful at zoom-out
    where individual dots overlap into noise.

    ── TODO 6 — Tectonic plate boundary overlay ────────────────────────────────
    Load the Peter Bird plate boundaries GeoJSON (public domain, ~200 KB) as a
    toggleable L.geoJSON polyline layer styled in white or gold so it contrasts
    with the OSM basemap. Toggle with a checkbox or button in the control panel.

    ── TODO 7 — Date range filter ──────────────────────────────────────────────
    Add two <input type="date"> pickers (startDate / endDate) below the mag
    slider. In applyFilters(), additionally skip markers whose props.date falls
    outside the chosen window. Pair with a "Reset dates" button.
  -->

  <div id="controls">
    <h3>GroundTruth Controls</h3>

    <!-- Feature 1: Magnitude range slider -->
    <div class="ctrl-row">
      <div class="ctrl-label">
        Min magnitude &nbsp;<strong id="mag-display">4.5</strong>
      </div>
      <input type="range" id="mag-slider" min="4.5" max="9.0" step="0.1" value="4.5" />
    </div>

    <!-- Feature 2: Depth color mode toggle -->
    <div class="ctrl-row">
      <button id="color-toggle">Color by: Magnitude</button>
    </div>

    <!-- Feature 3: Stats panel -->
    <div class="stats-divider"></div>
    <div id="stats">
      <div id="stat-count">Loading&hellip;</div>
      <div id="stat-max"></div>
      <div id="stat-dates"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ── Map setup ──────────────────────────────────────────────────────────────
    const map = L.map('map', { preferCanvas: true }).setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' +
        ' | Seismicity: <a href="https://earthquake.usgs.gov/">USGS</a>'
    }).addTo(map);

    // ── Color helpers ──────────────────────────────────────────────────────────
    function magColor(mag) {
      if (mag < 5.0) return '#00b300';   // green    — minor
      if (mag < 5.5) return '#80cc00';   // lime     — light
      if (mag < 6.0) return '#ffcc00';   // yellow   — moderate
      if (mag < 6.5) return '#ff8000';   // orange   — strong
      if (mag < 7.0) return '#ff0000';   // red      — major
      return '#990000';                   // dark red — great
    }

    // Feature 2 — three seismological depth zones match the Python histogram
    function depthColor(depth) {
      if (depth < 70)  return '#29b6f6';   // shallow       — sky blue
      if (depth < 300) return '#ff8800';   // intermediate  — amber
      return '#ab47bc';                     // deep          — purple
    }

    function magRadius(mag) {
      // Exponential: M5 → ~3 px, M6 → ~6 px, M7 → ~12 px, M8+ → ~24 px
      return Math.pow(2, mag - 4) * 1.5;
    }

    // ── State ──────────────────────────────────────────────────────────────────
    let allMarkers = [];          // { marker, props }
    let colorMode  = 'magnitude'; // 'magnitude' | 'depth'
    let minMag     = 4.5;

    function currentFill(props) {
      return colorMode === 'depth' ? depthColor(props.depth_km) : magColor(props.magnitude);
    }

    // ── Feature 1 + 3: filter and refresh stats ────────────────────────────────
    function applyFilters() {
      let shown = 0, maxMag = -Infinity, maxPlace = '';
      let earliest = Infinity, latest = -Infinity;

      allMarkers.forEach(({ marker, props }) => {
        if (props.magnitude >= minMag) {
          marker.addTo(map);
          marker.setStyle({ fillColor: currentFill(props) });
          shown++;
          if (props.magnitude > maxMag) { maxMag = props.magnitude; maxPlace = props.title; }
          const t = new Date(props.date).getTime();
          if (t < earliest) earliest = t;
          if (t > latest)   latest   = t;
        } else {
          map.removeLayer(marker);
        }
      });

      // Feature 3 — update stats panel
      document.getElementById('stat-count').textContent =
        `${shown.toLocaleString()} / ${allMarkers.length.toLocaleString()} events shown`;
      if (shown > 0) {
        document.getElementById('stat-max').textContent =
          `Largest: M${maxMag.toFixed(1)} — ${maxPlace}`;
        document.getElementById('stat-dates').textContent =
          new Date(earliest).toISOString().slice(0, 10) +
          ' → ' +
          new Date(latest).toISOString().slice(0, 10);
      } else {
        document.getElementById('stat-max').textContent  = 'No events in range';
        document.getElementById('stat-dates').textContent = '';
      }
    }

    // ── Load GeoJSON ───────────────────────────────────────────────────────────
    fetch('earthquakes.geojson')
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(data => {
        data.features
          .filter(f => f.properties.title !== 'Legend')
          .forEach(feature => {
            const p   = feature.properties;
            const lon = feature.geometry.coordinates[0];
            const lat = feature.geometry.coordinates[1];

            const marker = L.circleMarker([lat, lon], {
              radius:      magRadius(p.magnitude),
              fillColor:   magColor(p.magnitude),
              color:       'rgba(0,0,0,0.45)',
              weight:      0.5,
              fillOpacity: 0.8,
            });

            const latStr = Math.abs(lat).toFixed(3) + '\xb0' + (lat >= 0 ? 'N' : 'S');
            const lonStr = Math.abs(lon).toFixed(3) + '\xb0' + (lon >= 0 ? 'E' : 'W');
            marker.bindPopup(`
              <b style="font-size:14px">${p.title}</b><br>
              <span style="color:${magColor(p.magnitude)}">&#9679;</span>
              <b>M${p.magnitude.toFixed(1)}</b> &mdash; ${p.depth_km}&thinsp;km deep<br>
              ${p.date}<br>
              ${latStr}, ${lonStr}<br>
              <a href="${p.url}" target="_blank" rel="noopener"
                 style="color:#0066cc;font-weight:600;">&#8599;&nbsp;USGS Event Page</a>
            `, { maxWidth: 300 });

            allMarkers.push({ marker, props: p });
          });

        applyFilters();
      })
      .catch(err => {
        document.body.innerHTML =
          '<p style="padding:20px;color:#c00;font-size:14px">' +
          '<b>Could not load earthquakes.geojson</b><br>' +
          err.message + '<br><br>' +
          'Run <code>python earthquake_explorer.py</code> to generate the data file, ' +
          'then serve locally with <code>python -m http.server</code> and open ' +
          '<a href="http://localhost:8000">http://localhost:8000</a>.' +
          '</p>';
      });

    // ── Feature 1: magnitude slider ────────────────────────────────────────────
    const magSlider  = document.getElementById('mag-slider');
    const magDisplay = document.getElementById('mag-display');

    magSlider.addEventListener('input', () => {
      minMag = parseFloat(magSlider.value);
      magDisplay.textContent = minMag.toFixed(1);
      applyFilters();
    });

    // ── Feature 2: color mode toggle ───────────────────────────────────────────
    const colorBtn = document.getElementById('color-toggle');

    colorBtn.addEventListener('click', () => {
      colorMode = colorMode === 'magnitude' ? 'depth' : 'magnitude';
      const byDepth = colorMode === 'depth';
      colorBtn.textContent = byDepth ? 'Color by: Depth' : 'Color by: Magnitude';
      colorBtn.classList.toggle('active-depth', byDepth);
      legend.update();
      applyFilters();
    });

    // ── Legend (reflects active color mode) ────────────────────────────────────
    const legend = L.control({ position: 'bottomright' });

    legend.onAdd = function () {
      this._div = L.DomUtil.create('div', 'legend');
      this.update();
      return this._div;
    };

    legend.update = function () {
      if (colorMode === 'magnitude') {
        const tiers = [
          ['#00b300', 'M &lt; 5.0',      'Minor'],
          ['#80cc00', 'M 5.0&ndash;5.5', 'Light'],
          ['#ffcc00', 'M 5.5&ndash;6.0', 'Moderate'],
          ['#ff8000', 'M 6.0&ndash;6.5', 'Strong'],
          ['#ff0000', 'M 6.5&ndash;7.0', 'Major'],
          ['#990000', 'M &ge; 7.0',      'Great'],
        ];
        this._div.innerHTML =
          '<div class="legend-title">Magnitude</div>' +
          tiers.map(([c, m, l]) =>
            `<div><span class="dot" style="background:${c}"></span>${m} &mdash; ${l}</div>`
          ).join('') +
          '<div class="legend-note">Dot size grows with magnitude</div>';
      } else {
        const tiers = [
          ['#29b6f6', 'Shallow &nbsp;(&lt; 70 km)'],
          ['#ff8800', 'Intermediate &nbsp;(70&ndash;300 km)'],
          ['#ab47bc', 'Deep &nbsp;(&gt; 300 km)'],
        ];
        this._div.innerHTML =
          '<div class="legend-title">Depth</div>' +
          tiers.map(([c, l]) =>
            `<div><span class="dot" style="background:${c}"></span>${l}</div>`
          ).join('') +
          '<div class="legend-note">Dot size grows with magnitude</div>';
      }
    };

    legend.addTo(map);
  </script>
</body>
</html>
